<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tea Counter</title>
    <meta name="description" content="Daily tea consumption counter with offline local device storage and daily history tracking." />
    <meta name="theme-color" content="#b45309" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TeaCounter" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
    <meta property="og:title" content="Tea Counter" />
    <meta property="og:description" content="Daily tea consumption counter with offline local device storage and daily history tracking." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-stone-100">
    <div id="root">
      <div style="position: fixed; inset: 0; background: linear-gradient(to bottom, #451a03, #78350f, #0c0a09); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="width: 88px; height: 88px; background: #b45309; border-radius: 24px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(0,0,0,0.4); margin-bottom: 20px;">
          <img src="/pwa-192x192.png" alt="Tea Counter" style="width: 76px; height: 76px; border-radius: 18px;" />
        </div>
        <div style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em; color: #fef3c7;">Tea Counter</div>
        <div style="font-size: 13px; color: #fde68a; opacity: 0.8; margin-top: 6px;">Daily Chai & Tea Tracker</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
